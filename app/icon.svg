<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="shared-ai-research">
  <!--
    The uraeus, the rearing cobra of ancient Egypt, coiled over an AI chip:
    the tail crosses the die's lower edge, the body climbs its face, and the
    head rears clear of the top. Gold on ochre red, the pairing the originals
    were painted in. The snake is one tapered outline — a point at the tail,
    widening through the body, flaring behind the neck into the hood, then
    narrowing to the snout — carried over a background-coloured halo so the
    chip's own lines break behind it instead of tangling with it.
  -->
